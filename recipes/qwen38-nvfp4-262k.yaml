# Recipe: Qwen3.8-Flash-Next-Uncensored-NVFP4 (dual-node cluster)
# Two-node configuration using the direct podman-run lane (not the b12x recipe
# stack). Native 262K context (no YaRN), TP=2 + expert-parallel, MTP3 spec decode,
# fp8 KV + QSA fp8-KV patch, qwen3_coder tool parser.

recipe_version: "1"
name: Qwen3.8-Flash-Next-Uncensored-NVFP4
description: vLLM serving orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4 on a dual DGX Spark cluster

model: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
container: vllm/vllm-openai:qwen38-flash-next

cluster_only: true

volumes:
  - /models:/models

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144      # native context — do NOT raise without YaRN (see README context table)
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 3
  gpu_memory_utilization: 0.80

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"

command: |
  vllm serve orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --enable-expert-parallel \
    --all2all-backend allgather_reducescatter \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization compressed-tensors \
    --block-size {block_size} \
    --load-format safetensors \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --mm-processor-cache-gb 0 \
    --limit-mm-per-prompt '{{"image":1}}' \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
